name: Verify Language Detection

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  test-web-language:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Install dependencies
        run: |
          cd web
          npm ci --legacy-peer-deps
          npx playwright install chromium --with-deps

      - name: Run Playwright tests
        run: |
          cd web
          npx playwright test tests/language.spec.ts --reporter=list,github

  test-backend-context:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install Nix
        uses: cachix/install-nix-action@v25
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Build and Run Backend Tests
        run: |
          cd backend
          nix develop .#default --command bash -c "mkdir -p build && cd build && cmake .. && make viditacafe_tests && ./bin/viditacafe_tests"
