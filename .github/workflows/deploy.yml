name: Deploy Vidita Cafe

on:
  push:
    branches: [ main ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build-web:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: 24
          cache: 'npm'
          cache-dependency-path: web/package-lock.json

      - name: Build Web App
        run: |
          cd web
          npm ci --legacy-peer-deps
          npm run build
          # Verify video and manifest existence
          ls out/static/videos/ritual.mp4 || (echo "FATAL: ritual.mp4 missing from build output" && exit 1)
          ls out/manifest.json || (echo "FATAL: manifest.json missing from build output" && exit 1)

      - name: Run Local Lighthouse Audit
        run: |
          cd web
          # Start serve in the background
          npx serve -s out -l 3000 &
          SERVE_PID=$!
          
          # Wait for serve to be ready
          nux_timeout=30
          while ! curl -s http://localhost:3000 > /dev/null; do
            sleep 1
            nux_timeout=$((nux_timeout - 1))
            if [ $nux_timeout -le 0 ]; then echo "Serve failed to start"; exit 1; fi
          done

          mkdir -p ../lighthouse-local-reports
          cat <<EOF > ../lhci-local-config.js
          module.exports = {
            ci: {
              collect: {
                url: ['http://localhost:3000/'],
                numberOfRuns: 1,
                settings: {
                  chromeFlags: '--no-sandbox --headless --disable-gpu --disable-dev-shm-usage',
                },
              },
              upload: {
                target: 'filesystem',
                outputDir: '../lighthouse-local-reports',
              },
            },
          };
          EOF
          npx lhci collect --config=../lhci-local-config.js --print-summary
          
          kill $SERVE_PID
      
      - name: Upload Web Artifact
        uses: actions/upload-artifact@v7
        with:
          name: web-out
          path: web/out/
          retention-days: 1

  build-and-deploy-backend:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install Nix
        uses: cachix/install-nix-action@v25
        with:
          nix_path: nixpkgs=channel:nixos-unstable

      - name: Sync and Build on Server
        env:
          SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts

          # Sync source
          rsync -avz --delete backend/ root@$HOST:/opt/viditacafe-src/
          
          # Remote build
          ssh root@$HOST "cd /opt/viditacafe-src && nix build .#default -o /opt/viditacafe/result"

  deploy-final:
    needs: [build-web, build-and-deploy-backend]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Download Web Artifact
        uses: actions/download-artifact@v8
        with:
          name: web-out
          path: deploy/www

      - name: Prepare Assets and Migrations
        run: |
          cp backend/config.json deploy/
          cp -r backend/migrations deploy/

      - name: Deploy Assets and Migrations via SSH
        env:
          SSH_PRIVATE_KEY: ${{ secrets.DEPLOY_SSH_KEY }}
          HOST: ${{ secrets.DEPLOY_HOST }}
        run: |
          mkdir -p ~/.ssh
          echo "$SSH_PRIVATE_KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts
          # Sync everything in deploy/ to /opt/viditacafe/
          rsync -avz deploy/ root@$HOST:/opt/viditacafe/

      - name: Apply Migrations and Restart Service
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.DEPLOY_HOST }}
          username: root
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          script: |
            # Initialize migration tracking table
            sudo -u postgres psql -d viditacafe -c "CREATE TABLE IF NOT EXISTS applied_migrations (filename VARCHAR(255) PRIMARY KEY, applied_at TIMESTAMP WITH TIME ZONE DEFAULT CURRENT_TIMESTAMP);"

            # Apply all SQL migrations in sorted order if not already applied
            MIGRATION_DIR="/opt/viditacafe/migrations"
            for f in $(ls $MIGRATION_DIR/*.sql | sort); do
              filename=$(basename "$f")
              
              # Check if migration was already applied
              is_applied=$(sudo -u postgres psql -d viditacafe -tAc "SELECT 1 FROM applied_migrations WHERE filename = '$filename'")
              
              if [ "$is_applied" != "1" ]; then
                echo "Applying migration: $filename"
                sudo -u postgres psql -d viditacafe -f "$f"
                
                if [ $? -eq 0 ]; then
                  sudo -u postgres psql -d viditacafe -c "INSERT INTO applied_migrations (filename) VALUES ('$filename')"
                  echo "Successfully applied and recorded: $filename"
                else
                  echo "FAILED to apply migration: $filename"
                  exit 1
                fi
              else
                echo "Skipping already applied migration: $filename"
              fi
            done

            cat <<EOF > /etc/systemd/system/viditacafe.service
            [Unit]
            Description=Vidita Cafe Backend
            After=network.target postgresql.service

            [Service]
            Type=simple
            User=root
            WorkingDirectory=/opt/viditacafe
            ExecStart=/opt/viditacafe/result/bin/viditacafe-backend
            Restart=always

            [Install]
            WantedBy=multi-user.target
            EOF
            
            systemctl daemon-reload
            systemctl enable viditacafe
            systemctl restart viditacafe

  verify-live-ui:
    needs: [deploy-final]
    runs-on: ubuntu-latest
    container:
      image: mcr.microsoft.com/playwright:v1.50.1-noble
    steps:
      - name: Checkout code
        uses: actions/checkout@v6

      - name: Install Lighthouse and Playwright
        run: |
          npm install -g @lhci/cli@0.14.x playwright@1.50.1
          echo "NODE_PATH=$(npm root -g)" >> $GITHUB_ENV

      - name: Find Chrome Binary
        run: |
          # Use playwright's utility to find the path
          CHROME_BIN=$(node -e "console.log(require('playwright').chromium.executablePath())")
          echo "CHROME_PATH=$CHROME_BIN" >> $GITHUB_ENV
          echo "SUCCESS: Set CHROME_PATH to $CHROME_BIN"

      - name: Run Live Lighthouse Audit
        run: |
          mkdir -p lighthouse-live-reports
          cat <<'EOF' > lhci-live-config.js
          module.exports = {
            ci: {
              collect: {
                url: [
                  'https://viditacafe.com/',
                  'https://viditacafe.com/journey',
                  'https://viditacafe.com/brewing',
                  'https://viditacafe.com/equipment',
                  'https://viditacafe.com/search'
                ],
                numberOfRuns: 1,
                settings: {
                  chromeFlags: '--no-sandbox --headless --disable-gpu --disable-dev-shm-usage',
                  onlyCategories: ['performance', 'accessibility', 'best-practices', 'seo', 'pwa'],
                },
              },
              upload: {
                target: 'filesystem',
                outputDir: './lighthouse-live-reports',
              },
            },
          };
          EOF
          lhci collect --config=./lhci-live-config.js --print-summary
          lhci upload --config=./lhci-live-config.js

      - name: Capture Live Screenshots
        run: |
          cat <<'EOF' > capture.js
          const { chromium } = require('playwright');
          (async () => {
            const browser = await chromium.launch();
            const page = await browser.newPage();
            
            const screens = [
              { name: 'home', path: '/' },
              { name: 'journey', path: '/journey' },
              { name: 'brewing', path: '/brewing' },
              { name: 'equipment', path: '/equipment' },
              { name: 'search', path: '/search' }
            ];

            const viewports = [
              { name: 'desktop', width: 1280, height: 800 },
              { name: 'iphone-se', width: 375, height: 667 },
              { name: 'iphone-se-safari', width: 375, height: 560 },
              { name: 'iphone-pro', width: 375, height: 812 }
            ];

            for (const viewport of viewports) {
              await page.setViewportSize({ width: viewport.width, height: viewport.height });
              
              for (const screen of screens) {
                const url = `https://viditacafe.com${screen.path}`;
                console.log(`Capturing ${screen.name} [${viewport.name}] at ${url}...`);
                
                try {
                  await page.setExtraHTTPHeaders({ 'X-Vidita-Language': 'en' });
                  await page.goto(url, { waitUntil: 'networkidle' });
                  await page.waitForTimeout(2000); 

                  await page.screenshot({ path: `${screen.name}-${viewport.name}-top.png` });

                  if (screen.name === 'home' && (viewport.name === 'iphone-se' || viewport.name === 'iphone-se-safari')) {
                    console.log(`  Simulating interaction on ${viewport.name} home feed...`);
                    
                    // Capture multiple cards to verify suggestion layouts
                    for (let i = 1; i <= 8; i++) {
                      await page.mouse.wheel(0, viewport.height);
                      await page.waitForTimeout(1000);
                      await page.screenshot({ path: `${screen.name}-${viewport.name}-card-${i}.png` });
                    }

                    await page.screenshot({ path: `${screen.name}-${viewport.name}-full.png`, fullPage: true });
                  }
                } catch (e) {
                  console.error(`Failed to capture ${screen.name}: ${e.message}`);
                }
              }
            }
            await browser.close();
          })();
          EOF
          node capture.js

      - name: Upload Deployment Verification
        uses: actions/upload-artifact@v7
        with:
          name: deployment-verification
          path: |
            *.png
            lighthouse-live-reports
          retention-days: 7
